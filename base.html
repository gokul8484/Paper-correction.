<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SmartEval{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
{% if session.teacher_id %}
<header class="nav">
  <a class="brand" href="{{ url_for('main.dashboard') }}">🎓 SmartEval</a>
  <nav>
    <a href="{{ url_for('main.dashboard') }}">Dashboard</a>
    <a href="{{ url_for('main.exam_new') }}">New Exam</a>
    <form method="post" action="{{ url_for('main.logout') }}" class="inline">
      <input type="hidden" name="csrf" value="{{ csrf_token }}">
      <button class="link">Logout ({{ session.username }})</button>
    </form>
  </nav>
</header>
{% endif %}
<main class="container">
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in msgs %}<div class="alert {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
